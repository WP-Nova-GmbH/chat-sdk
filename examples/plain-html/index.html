<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova Chat SDK Plain HTML Example</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; }
      #nova-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 100dvh;
        align-items: stretch;
      }
      main { min-width: 0; padding: 2rem; }
    </style>
  </head>
  <body>
    <div id="nova-layout">
      <main>
        <h1>Nova Chat SDK Plain HTML Example</h1>
        <button id="demo-toast" type="button">Host-page action target</button>
        <button id="presentation-toggle" type="button">Switch to sidebar</button>
      </main>
    </div>
    <script>
      ((w, d, s) => {
        w.WpNova = w.WpNova || ((...args) => {
          w.WpNova.q = w.WpNova.q || [];
          w.WpNova.q.push(args);
        });
        var j = d.createElement(s);
        j.async = 1;
        j.src = "https://chat.wp-nova.ai/sdk/v1/sdk.js";
        d.head.appendChild(j);
      })(window, document, "script");

      WpNova("registerToolHandler", "show_toast", (args) => {
        document.getElementById("demo-toast").textContent = String(args.message || "Hello from Nova");
        return { ok: true };
      });

      var presentationMode = "popover";
      function initNova() {
        WpNova("init", {
          publicSurfaceId: "srf_live_replace_me",
          tokenEndpoint: "/api/nova-token",
          mount: "#nova-layout",
          presentation:
            presentationMode === "sidebar"
              ? { mode: "sidebar", width: 384 }
              : { mode: "popover" },
        });
      }

      document.getElementById("presentation-toggle").addEventListener("click", function () {
        presentationMode = presentationMode === "popover" ? "sidebar" : "popover";
        this.textContent =
          presentationMode === "popover" ? "Switch to sidebar" : "Switch to pop-over";
        initNova();
      });

      initNova();
    </script>
  </body>
</html>
